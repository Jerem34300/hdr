<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140810"/>
      <stop offset="1" stop-color="#2a0e18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#FF6B9A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF6B9A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD0DE"/>
      <stop offset=".4" stop-color="#FF6B9A"/>
      <stop offset="1" stop-color="#C81E4A"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- bar counter -->
  <rect x="0" y="560" width="1200" height="240" fill="#1a0b10"/>
  <rect x="0" y="548" width="1200" height="18" fill="#FF6B9A" opacity=".85"/>
  <rect x="0" y="548" width="1200" height="18" fill="#FF6B9A" opacity=".45" filter="url(#blur)"/>
  <!-- bottles on the back -->
  <g fill="#FF6B9A" opacity=".35">
    <rect x="140" y="390" width="28" height="160" rx="6"/>
    <rect x="190" y="360" width="24" height="190" rx="6"/>
    <rect x="230" y="410" width="26" height="140" rx="6"/>
    <rect x="920" y="370" width="26" height="180" rx="6"/>
    <rect x="960" y="400" width="22" height="150" rx="6"/>
    <rect x="1000" y="355" width="28" height="195" rx="6"/>
  </g>
  <g fill="#FF8FB0" opacity=".2">
    <ellipse cx="154" cy="390" rx="16" ry="10"/>
    <ellipse cx="202" cy="360" rx="14" ry="9"/>
    <ellipse cx="243" cy="410" rx="15" ry="9"/>
    <ellipse cx="933" cy="370" rx="15" ry="9"/>
    <ellipse cx="971" cy="400" rx="13" ry="8"/>
    <ellipse cx="1014" cy="355" rx="16" ry="10"/>
  </g>
  <!-- cocktail glass -->
  <g transform="translate(600 430)">
    <path d="M0 20 C-90 20 -110 90 -40 130 L-8 150 L-8 210 L-50 230 L50 230 L8 210 L8 150 L40 130 C110 90 90 20 0 20 Z" fill="url(#neon)" opacity=".95"/>
    <path d="M-70 38 C-40 70 40 70 70 38" fill="none" stroke="#FFD0DE" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <circle cx="-20" cy="70" r="10" fill="#FFD0DE" opacity=".8"/>
    <circle cx="18" cy="86" r="7" fill="#fff" opacity=".5"/>
    <rect x="-4" y="150" width="8" height="62" fill="#FFD0DE" opacity=".8"/>
  </g>
  <!-- stem glow -->
  <ellipse cx="600" cy="662" rx="90" ry="14" fill="#FF6B9A" opacity=".35" filter="url(#soft)"/>
</svg>
