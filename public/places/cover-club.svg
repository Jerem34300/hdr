<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Club">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0818"/>
      <stop offset="1" stop-color="#16102c"/>
    </linearGradient>
    <radialGradient id="v" cx="30%" cy="30%" r="50%">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p" cx="80%" cy="70%" r="45%">
      <stop offset="0" stop-color="#D8B4FE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#D8B4FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#6D5AE0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#v)"/>
  <rect width="1200" height="800" fill="url(#p)"/>
  <!-- light beams -->
  <g fill="#8B7CFF" opacity=".18">
    <polygon points="600,80 360,800 480,800"/>
    <polygon points="600,80 700,800 820,800"/>
    <polygon points="600,80 200,800 300,800"/>
  </g>
  <!-- disco ball -->
  <g transform="translate(600 280)">
    <line x1="0" y1="-200" x2="0" y2="-110" stroke="#C4B5FD" stroke-width="4"/>
    <circle cx="0" cy="0" r="120" fill="url(#ball)"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#EDE9FE" stroke-width="3" opacity=".5"/>
    <g fill="#fff" opacity=".35">
      <rect x="-70" y="-70" width="28" height="28" transform="rotate(20)"/>
      <rect x="-20" y="-80" width="26" height="26" transform="rotate(-10)"/>
      <rect x="30" y="-60" width="28" height="28" transform="rotate(15)"/>
      <rect x="-80" y="-10" width="26" height="26" transform="rotate(-20)"/>
      <rect x="-15" y="-15" width="30" height="30"/>
      <rect x="40" y="-5" width="26" height="26" transform="rotate(25)"/>
      <rect x="-60" y="40" width="28" height="28" transform="rotate(-15)"/>
      <rect x="10" y="45" width="26" height="26" transform="rotate(10)"/>
      <rect x="50" y="40" width="24" height="24" transform="rotate(-8)"/>
    </g>
    <circle cx="-30" cy="-30" r="10" fill="#fff" opacity=".7"/>
  </g>
  <!-- floor lights -->
  <g>
    <ellipse cx="240" cy="720" rx="70" ry="16" fill="#8B7CFF" opacity=".5" filter="url(#blur)"/>
    <ellipse cx="480" cy="740" rx="80" ry="16" fill="#C4B5FD" opacity=".4" filter="url(#blur)"/>
    <ellipse cx="760" cy="730" rx="70" ry="16" fill="#8B7CFF" opacity=".5" filter="url(#blur)"/>
    <ellipse cx="980" cy="745" rx="60" ry="14" fill="#D8B4FE" opacity=".4" filter="url(#blur)"/>
  </g>
</svg>
