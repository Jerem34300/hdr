<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Boutique">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141c"/>
      <stop offset="1" stop-color="#0c2530"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3DC4F5" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3DC4F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- awning -->
  <path d="M180 260 H1020 L980 330 H220 Z" fill="#3DC4F5" opacity=".85"/>
  <path d="M180 260 H1020 L980 330 H220 Z" fill="#3DC4F5" opacity=".25" filter="url(#blur)"/>
  <g fill="#07141c" opacity=".25">
    <rect x="250" y="260" width="70" height="70"/>
    <rect x="390" y="260" width="70" height="70"/>
    <rect x="530" y="260" width="70" height="70"/>
    <rect x="670" y="260" width="70" height="70"/>
    <rect x="810" y="260" width="70" height="70"/>
  </g>
  <!-- window frame -->
  <rect x="240" y="350" width="720" height="380" rx="8" fill="#0a1c24" stroke="#7DD3FC" stroke-width="6"/>
  <line x1="600" y1="350" x2="600" y2="730" stroke="#7DD3FC" stroke-width="4" opacity=".4"/>
  <!-- simple hanging items (tasteful silhouettes) -->
  <g fill="none" stroke="#7DD3FC" stroke-width="6" opacity=".7">
    <path d="M360 430 v40"/>
    <path d="M320 470 q40 80 80 0" />
    <path d="M820 430 v40"/>
    <path d="M780 470 q40 80 80 0"/>
  </g>
  <g fill="#3DC4F5" opacity=".35">
    <rect x="430" y="500" width="90" height="140" rx="8"/>
    <rect x="680" y="500" width="90" height="140" rx="8"/>
  </g>
  <!-- sign -->
  <rect x="430" y="180" width="340" height="56" rx="10" fill="#3DC4F5"/>
  <rect x="430" y="180" width="340" height="56" rx="10" fill="none" stroke="#A5F3FC" stroke-width="3"/>
</svg>
