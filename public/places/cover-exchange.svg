<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Club échangiste">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0c0a"/>
      <stop offset="1" stop-color="#2a1210"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#FF7A5C" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FF7A5C" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- two arches / doorways -->
  <g fill="none" stroke="#FF7A5C" stroke-width="10" stroke-linecap="round">
    <path d="M280 700 V380 Q280 200 430 200 Q580 200 580 380 V700"/>
    <path d="M620 700 V380 Q620 200 770 200 Q920 200 920 380 V700"/>
  </g>
  <g fill="none" stroke="#FFB4A3" stroke-width="4" opacity=".6">
    <path d="M300 700 V390 Q300 230 430 230 Q560 230 560 390 V700"/>
    <path d="M640 700 V390 Q640 230 770 230 Q900 230 900 390 V700"/>
  </g>
  <!-- warm interior light -->
  <path d="M300 700 V390 Q300 230 430 230 Q560 230 560 390 V700 Z" fill="#FF7A5C" opacity=".15"/>
  <path d="M640 700 V390 Q640 230 770 230 Q900 230 900 390 V700 Z" fill="#FF7A5C" opacity=".15"/>
  <!-- velvet rope between -->
  <path d="M580 520 C600 560 620 560 640 520" fill="none" stroke="#FFB4A3" stroke-width="8" stroke-linecap="round"/>
  <circle cx="580" cy="520" r="10" fill="#FFB4A3"/>
  <circle cx="640" cy="520" r="10" fill="#FFB4A3"/>
  <ellipse cx="600" cy="720" rx="260" ry="20" fill="#FF7A5C" opacity=".25" filter="url(#blur)"/>
</svg>
