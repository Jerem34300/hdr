<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Association">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07140f"/>
      <stop offset="1" stop-color="#0f241c"/>
    </linearGradient>
    <radialGradient id="v" cx="28%" cy="28%" r="55%">
      <stop offset="0" stop-color="#34D399" stop-opacity=".45"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p" cx="78%" cy="72%" r="48%">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#v)"/>
  <rect width="1200" height="800" fill="url(#p)"/>
  <!-- track -->
  <g fill="none" stroke="#34D399" stroke-linecap="round">
    <ellipse cx="600" cy="430" rx="340" ry="200" stroke-width="18" opacity=".55"/>
    <ellipse cx="600" cy="430" rx="250" ry="140" stroke-width="8" opacity=".28"/>
    <ellipse cx="600" cy="430" rx="160" ry="84" stroke-width="4" opacity=".18"/>
  </g>
  <!-- lane marks -->
  <g stroke="#A7F3D0" stroke-width="5" stroke-linecap="round" opacity=".45">
    <line x1="600" y1="230" x2="600" y2="258"/>
    <line x1="600" y1="602" x2="600" y2="630"/>
    <line x1="260" y1="430" x2="288" y2="430"/>
    <line x1="912" y1="430" x2="940" y2="430"/>
  </g>
  <!-- runner, stroke only -->
  <g transform="translate(600 360)" fill="none" stroke="#ECFDF5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="-118" r="22" stroke-width="9"/>
    <path d="M8 -90 L-8 -20 L-70 70"/>
    <path d="M-8 -20 L70 8"/>
    <path d="M-8 -20 L18 86 L-10 160"/>
    <path d="M18 86 L88 150"/>
    <path d="M8 -90 L-62 -40"/>
