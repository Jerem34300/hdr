<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Bar cruising">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140c06"/>
      <stop offset="1" stop-color="#1c1008"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140c06"/>
      <stop offset=".5" stop-color="#2a1608"/>
      <stop offset="1" stop-color="#140c06"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- corridor perspective -->
  <polygon points="200,80 1000,80 1100,800 100,800" fill="url(#hall)"/>
  <polygon points="480,80 720,80 780,800 420,800" fill="#0c0804" opacity=".5"/>
  <!-- neon side strips -->
  <g stroke="#FF8A1F" stroke-linecap="round">
    <line x1="280" y1="140" x2="180" y2="720" stroke-width="8" opacity=".9"/>
    <line x1="920" y1="140" x2="1020" y2="720" stroke-width="8" opacity=".9"/>
    <line x1="280" y1="140" x2="180" y2="720" stroke-width="22" opacity=".25" filter="url(#blur)"/>
    <line x1="920" y1="140" x2="1020" y2="720" stroke-width="22" opacity=".25" filter="url(#blur)"/>
  </g>
  <!-- door at the end -->
  <rect x="530" y="260" width="140" height="220" rx="8" fill="#FF8A1F" opacity=".2"/>
  <rect x="530" y="260" width="140" height="220" rx="8" fill="none" stroke="#FFB56A" stroke-width="5"/>
  <circle cx="650" cy="380" r="6" fill="#FFD7A8"/>
  <!-- floor reflection -->
  <polygon points="420,800 780,800 720,520 480,520" fill="#FF8A1F" opacity=".12"/>
</svg>
