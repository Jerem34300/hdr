[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/ambassadeur/guide"
  to = "/ambassadeur/guide.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/fr/rencontre-gay-:ville"
  to = "/fr/sortir-rencontrer-:ville"
  status = 301
  force = true
